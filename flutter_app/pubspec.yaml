name: absensi_smk_ypk
description: "Aplikasi Mobile Presensi & Super App SMK YPK Medan berbasis Flutter Native terhubung Supabase."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & Database
  supabase_flutter: ^2.5.0

  # State Management
  provider: ^6.1.2

  # Perangkat & Sensor Native HP
  geolocator: ^11.0.0
  device_info_plus: ^10.0.0
  shared_preferences: ^2.2.3

  # UI, Icons, Typography & Animasi
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
