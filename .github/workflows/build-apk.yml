name: Build Android APK (SMK YPK MEDAN)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output/SMK_YPK_SUPER_APP.apk \;
          ls -la output/

      - name: Upload APK as Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMK_YPK_SUPER_APP_APK
          path: output/SMK_YPK_SUPER_APP.apk
          retention-days: 60

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "📱 SMK YPK SUPER APP (Android APK)"
          body: |
            ### 🏫 Aplikasi Android Resmi SMK YPK MEDAN
            
            Aplikasi Presensi Digital, ID Card, dan CBT Terpadu SMK YPK Medan.
            
            **✨ Keunggulan Aplikasi:**
            - 🚀 **Auto-Update**: Cukup install 1 kali, aplikasi otomatis selalu update saat server diperbarui.
            - 🔒 **Auto-Login**: Tidak perlu ketik password berulang kali saat membuka aplikasi.
            - 📱 **Batas 2 Perangkat**: Aman dan eksklusif untuk HP Siswa & HP Orang Tua.
            - ⚡ **Ringan & Cepat**: Ukuran sangat kecil (~2 MB) dan tampilan Full Screen.
            
            📥 **Download file `SMK_YPK_SUPER_APP.apk` di bawah dan pasang di HP Android.**
          files: output/SMK_YPK_SUPER_APP.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
