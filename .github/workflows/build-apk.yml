name: Build Android APK (SMK YPK MEDAN)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile & Package Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build APK Release
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Prepare APK File
        run: |
          mkdir -p output
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk output/SMK_YPK_SUPER_APP.apk
          ls -la output/

      - name: Upload APK as Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMK_YPK_SUPER_APP_APK
          path: output/SMK_YPK_SUPER_APP.apk
          retention-days: 60

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "📱 SMK YPK SUPER APP (Flutter Native APK)"
          body: |
            ### 🏫 Aplikasi Android Resmi SMK YPK MEDAN (Full Native Flutter)
            
            Aplikasi Presensi Digital, ID Card Pelajar, dan Mading Sekolah SMK YPK Medan.
            
            **✨ Fitur Unggulan:**
            - ⚡ **Full Native Flutter**: Tampilan modern, cepat, dan animasi halus 60 FPS.
            - 📍 **GPS Geofencing**: Presensi mandiri dalam radius area SMK YPK Medan.
            - 📡 **Live RFID Scanner**: Terhubung realtime dengan tap mesin kartu RFID di gerbang.
            - 🪪 **Digital ID Card**: Dilengkapi QR Code resmi untuk scan di meja piket.
            - 🔒 **Pembatasan 2 Perangkat**: Aman dan eksklusif untuk HP Siswa & HP Orang Tua.
            
            📥 **Download file `SMK_YPK_SUPER_APP.apk` di bawah dan instal di HP Android.**
          files: output/SMK_YPK_SUPER_APP.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
